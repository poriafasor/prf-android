<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRF Security - Admin Panel</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand">PRF Security</div>
  <div class="sub">Enterprise Device Check-in Database</div>
</header>

<section id="login" class="card">
  <h2>Sign in</h2>
  <p class="hint">Enter a GitHub token with <b>repo</b> scope on <b>poriafasor/prf-database</b>.
  The token stays in your browser and is used only to call the GitHub API directly from this page.</p>
  <input id="token" type="password" placeholder="github_pat_... / ghp_..." autocomplete="off">
  <div class="row">
    <input id="owner" placeholder="owner" value="poriafasor">
    <input id="repo" placeholder="repo" value="prf-database">
  </div>
  <button id="connect">Connect</button>
  <div id="err" class="err"></div>
</section>

<section id="panel" hidden>
  <div class="toolbar card">
    <div>
      <b id="dbMeta"></b>
      <div class="hint" id="dbCount"></div>
    </div>
    <span id="syncPill" class="pill" title="The database is watched; new check-ins appear here automatically">live</span>
    <button id="refresh" class="ghost">Refresh</button>
    <button id="logout" class="ghost">Sign out</button>
  </div>

  <div class="card">
    <h2>Devices</h2>
    <input id="search" placeholder="filter by device id / model…" autocomplete="off">
    <div id="devices" class="list"></div>
  </div>

  <div class="card" id="detailCard" hidden>
    <div class="dhead">
      <h2 id="detailTitle"></h2>
      <button id="deleteDevice" class="danger sm">Delete device</button>
    </div>

    <h3>Registered phone</h3>
    <div id="detailPhone" class="info">—</div>

    <h3>Device info</h3>
    <div id="detailInfo" class="info">—</div>

    <h3>Photos</h3>
    <div id="detailDates" class="dates"></div>
    <div id="detailImages"></div>

    <h3>Voice attendance</h3>
    <div id="detailVoices" class="voices"></div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
