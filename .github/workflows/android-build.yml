name: Build & Release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradlew'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # ── Stable signing identity ──────────────────────────────────────────
      # The keystore is cached (not committed) so every release shares one signing
      # certificate. Without this, each run regenerates debug.keystore and Android
      # refuses to upgrade an installed build ("signatures do not match").
      - name: Restore signing keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: |
            debug.keystore
            .keystore-meta
          key: prf-release-keystore-v1

      - name: Generate signing keystore
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PRF Security, OU=Mobile, O=PRF, L=Tehran, ST=Tehran, C=IR"
          echo "generated $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .keystore-meta

      - name: Keystore fingerprint
        run: |
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android \
            | grep -Ei "SHA256|Valid" | sed 's/^/  /'

      # The Gradle output is the only record of why a build failed, and the raw
      # log is not readable without a token. It is summarised into the job
      # summary here so a failure can be diagnosed from the run itself instead of
      # from guessing at the source.
      - name: Build release APK
        env:
          PRF_TOKEN: ${{ secrets.PRF_TOKEN }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Build failed (exit $status)"
              echo
              echo '```'
              grep -E "^(e: |\s*e: )" /tmp/gradle.log | head -60
              grep -E "^(FAILURE:|\* What went wrong:|\* Try:)" -A 6 /tmp/gradle.log | head -60
              grep -E "error:|Execution failed for task|Unresolved reference" /tmp/gradle.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Read version name
        id: ver
        run: |
          # versionName is the source of truth for the release title.
          grep -q "versionName" app/build.gradle.kts
          echo "name=v$(grep 'versionName' app/build.gradle.kts | sed 's/.*versionName *= *"\([^"]*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prf-security-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.name }}
          name: PRF Security ${{ steps.ver.outputs.name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
