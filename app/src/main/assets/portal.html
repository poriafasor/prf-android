<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PRF Security</title>
<style>
:root{
  --bg:#0e1418; --card:#151e24; --card2:#1b262e; --text:#eaf1f5; --dim:#8fa3ad;
  --accent:#2f7fe0; --accent2:#2159a8; --ok:#2fbf71; --warn:#e0a02f; --err:#e0533f;
  --line:#24323c; --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:20px 16px 32px;gap:16px;}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:16px;}
header{text-align:center;margin-top:8px;}
h1{font-size:24px;margin:0 0 6px;letter-spacing:.5px;}
.sub{color:var(--dim);font-size:13px;margin:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;display:flex;flex-direction:column;gap:12px;}
.card h2{font-size:15px;margin:0;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
label{font-size:13px;color:var(--dim);}
input[type=text],select{width:100%;padding:14px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);font-size:16px;outline:none;}
input[type=text]:focus,select:focus{border-color:var(--accent);}
.btn{width:100%;padding:15px;border-radius:12px;border:0;font-size:16px;font-weight:700;
  cursor:pointer;color:#fff;background:var(--accent);}
.btn:active{background:var(--accent2);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn.ok{background:var(--ok);}
.btn.warn{background:var(--warn);}
.btn:disabled{opacity:.45;pointer-events:none;}
.row{display:flex;gap:10px;}
.row .btn{flex:1;}
.muted{color:var(--dim);font-size:12px;text-align:center;line-height:1.6;}
#phoneRow{display:flex;gap:10px;align-items:center;}
#phoneRow input{flex:1;}
.badge{display:inline-block;background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:4px 12px;font-size:12px;color:var(--dim);}
#savedPhone{font-size:18px;font-weight:700;color:var(--ok);direction:ltr;text-align:center;}
.modal{position:fixed;inset:0;background:rgba(4,8,10,.86);display:none;align-items:center;
  justify-content:center;z-index:50;padding:20px;}
.modal.open{display:flex;}
.modal .box{background:var(--card);border-radius:var(--radius);padding:22px;width:100%;
  max-width:420px;display:flex;flex-direction:column;gap:14px;}
.modal .box h3{margin:0;font-size:18px;}
.modal .box p{margin:0;color:var(--dim);font-size:14px;line-height:1.7;}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp 1s linear infinite;display:none;margin:0 auto;}
@keyframes sp{to{transform:rotate(360deg);}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);
  border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:999px;
  font-size:13px;display:none;z-index:99;max-width:90%;text-align:center;}
.rec{display:none;flex-direction:column;align-items:center;gap:10px;}
.rec.on{display:flex;}
.dot{width:14px;height:14px;border-radius:50%;background:var(--err);animation:pl 1s infinite;}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PRF Security</h1>
    <p class="sub">Enterprise Device Check-in</p>
  </header>

  <div class="card" id="phoneCard">
    <h2>Phone Registration</h2>
    <div id="phoneRegistered">
      <p class="muted">Registered phone number</p>
      <div id="savedPhone">—</div>
      <div style="text-align:center;margin-top:6px;"><span class="badge" id="savedOperator">—</span></div>
      <div class="row" style="margin-top:14px;">
        <button class="btn warn" id="editPhoneBtn">Edit phone</button>
      </div>
    </div>
    <div id="phoneForm" style="display:none;flex-direction:column;gap:12px;">
      <label for="phoneInput">Phone number (numbers only)</label>
      <input type="text" id="phoneInput" inputmode="numeric" pattern="[0-9]*" placeholder="09xxxxxxxxx" autocomplete="off">
      <label for="operatorSelect">Operator</label>
      <select id="operatorSelect">
        <option value="">Select operator…</option>
        <option value="Irancell">ایرانسل</option>
        <option value="HamrahAvval">همراه اول</option>
        <option value="Ritel">رایتل</option>
        <option value="Shatel">شاتل</option>
        <option value="ApTel">آپتل</option>
      </select>
      <button class="btn" id="savePhoneBtn">Submit</button>
    </div>
  </div>

  <div class="card">
    <h2>Attendance</h2>
    <button class="btn ok" id="checkinBtn">Check in now</button>
    <button class="btn ghost" id="voiceBtn">Record 6-second attendance voice</button>
    <div class="rec" id="recPanel">
      <div class="dot"></div>
      <p class="muted" id="recText">Recording… speak now: today, date, present at company.</p>
    </div>
  </div>

  <div class="card">
    <h2>Device</h2>
    <p class="muted" id="deviceInfo">Loading…</p>
    <button class="btn ghost" id="settingsBtn">Settings</button>
  </div>
</div>

<div class="modal" id="consentModal">
  <div class="box">
    <h3 id="consentTitle">Confirm</h3>
    <p id="consentBody"></p>
    <div class="row">
      <button class="btn" id="consentYes">Yes</button>
      <button class="btn ghost" id="consentNo">No</button>
    </div>
  </div>
</div>

<div class="modal" id="spinModal">
  <div class="box" style="align-items:center;">
    <div class="spin" id="spinner"></div>
    <p class="muted" id="spinText">Working…</p>
  </div>
</div>

<div id="toast"></div>

<script>
const ANDROID = window.AndroidBridge;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg;
  t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2600); }
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function spin(on,text){ document.getElementById('spinner').style.display=on?'block':'none';
  if(text) document.getElementById('spinText').textContent=text;
  if(on) openModal('spinModal'); else closeModal('spinModal'); }

function askConsent(title, body, onYes){
  document.getElementById('consentTitle').textContent=title;
  document.getElementById('consentBody').textContent=body;
  const yes=document.getElementById('consentYes'), no=document.getElementById('consentNo');
  yes.onclick=()=>{ closeModal('consentModal'); onYes(); };
  no.onclick=()=>{ closeModal('consentModal'); };
  openModal('consentModal');
}

// --- Phone registration -----------------------------------------------------
const phoneInput=document.getElementById('phoneInput');
phoneInput.addEventListener('input', e=>{
  e.target.value = e.target.value.replace(/[^0-9]/g,'');
});

function refreshPhone(){
  if(!ANDROID) return;
  const p=ANDROID.getPhoneNumber(), op=ANDROID.getOperator();
  document.getElementById('savedPhone').textContent = p ? p : '—';
  document.getElementById('savedOperator').textContent = op ? op : '—';
}

document.getElementById('editPhoneBtn').addEventListener('click',()=>{
  document.getElementById('phoneForm').style.display='flex';
  document.getElementById('phoneRegistered').style.display='none';
  phoneInput.value = ANDROID ? ANDROID.getPhoneNumber() : '';
});

document.getElementById('savePhoneBtn').addEventListener('click',()=>{
  const num=phoneInput.value.replace(/[^0-9]/g,'');
  const op=document.getElementById('operatorSelect').value;
  if(!num){ toast('Enter numbers only'); return; }
  if(!op){ toast('Select an operator'); return; }
  if(!ANDROID){ toast('Bridge unavailable'); return; }
  const ok=ANDROID.savePhoneNumber(num, op);
  if(ok){
    toast('Saved');
    document.getElementById('phoneForm').style.display='none';
    document.getElementById('phoneRegistered').style.display='flex';
    refreshPhone();
  } else { toast('Could not save'); }
});

// --- Attendance -------------------------------------------------------------
document.getElementById('checkinBtn').addEventListener('click',()=>{
  askConsent('Photo check-in','Your check-in needs 6 photos: 3 front and 3 rear, plus device info. Nothing is captured before you press Yes.', ()=>{
    if(ANDROID) ANDROID.startPhotoCheckIn();
  });
});

document.getElementById('voiceBtn').addEventListener('click',()=>{
  askConsent('Voice attendance','Do you consent to a 6-second voice recording for attendance? You may say: today, date, I am present at the company.', ()=>{
    if(ANDROID) ANDROID.startVoiceAttendance();
    document.getElementById('recPanel').classList.add('on');
  });
});

document.getElementById('settingsBtn').addEventListener('click',()=>{
  if(ANDROID) ANDROID.openSettings();
});

window.addEventListener('DOMContentLoaded',()=>{
  if(ANDROID){
    refreshPhone();
    document.getElementById('deviceInfo').textContent=ANDROID.getDeviceInfo();
  } else {
    document.getElementById('deviceInfo').textContent='Bridge unavailable - running outside app';
  }
});
</script>
</body>
</html>
